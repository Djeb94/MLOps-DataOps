<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Estimation du prix d'une maison (ONNX)</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.min.js"></script>
</head>
<body>
  <h1>Estimation du prix d'une maison</h1>
  <p id="status">Chargement du modèle...</p>

  <form id="house-form">
    <p>
      <label for="size">Surface (m²) :</label>
      <input type="number" id="size" name="size" min="1" step="0.1" value="100" required>
    </p>
    <p>
      <label for="nb_rooms">Nombre de chambres :</label>
      <input type="number" id="nb_rooms" name="nb_rooms" min="0" step="1" value="3" required>
    </p>
    <p>
      <label for="garden">Jardin :</label>
      <input type="checkbox" id="garden" name="garden" checked>
    </p>
    <p>
      <button type="submit" id="submit" disabled>Estimer le prix</button>
    </p>
  </form>

  <p id="result"></p>

  <script>
    const form = document.getElementById("house-form");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const submitButton = document.getElementById("submit");

    let session = null;

    // Chargement du modèle une seule fois, à l'ouverture de la page
    async function loadModel() {
      try {
        ort.env.wasm.numThreads = 1;
        session = await ort.InferenceSession.create("model.onnx", {
          executionProviders: ["wasm"],
        });
        status.textContent = "Modèle chargé, prêt à prédire.";
        submitButton.disabled = false;
      } catch (error) {
        console.error(error);
        status.textContent = "Impossible de charger le modèle : " + error.message;
      }
    }

    async function predict(size, nbRooms, garden) {
      const values = Float32Array.from([size, nbRooms, garden]);
      const input = new ort.Tensor("float32", values, [1, 3]);
      const outputs = await session.run({ [session.inputNames[0]]: input });
      return outputs[session.outputNames[0]].data[0];
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const size = Number(form.size.value);
      const nbRooms = Number(form.nb_rooms.value);
      const garden = form.garden.checked ? 1 : 0;

      try {
        const price = await predict(size, nbRooms, garden);
        result.textContent =
          `Prix estimé : ${Math.round(price).toLocaleString("fr-FR")} € ` +
          `(surface ${size} m², ${nbRooms} chambre(s), ${garden ? "avec" : "sans"} jardin)`;
      } catch (error) {
        console.error(error);
        result.textContent = "Erreur pendant la prédiction : " + error.message;
      }
    });

    loadModel();
  </script>
</body>
</html>
